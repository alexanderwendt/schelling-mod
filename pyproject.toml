[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schelling-mod"
version = "0.1.0"
description = "Modified Schelling segregation simulator with a Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "streamlit==1.56.0",
]

[tool.setuptools.packages.find]
include = ["schelling_mod*"]
